version: '3.8'

services:
  # Database Keycloak
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  # Keycloak Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: keycloak
    command: start-dev # Chạy chế độ Dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin       # User đăng nhập trang quản trị
      KEYCLOAK_ADMIN_PASSWORD: admin # Pass đăng nhập trang quản trị

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
    ports:
      - "9090:8080" # Map ra port 9090
    depends_on:
      - keycloak-db

volumes:
  keycloak_data: