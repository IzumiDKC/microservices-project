server:
  port: 8083

spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://localhost:5432/social_post_db
    username: postgres
    password: 281100
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/social-network/protocol/openid-connect/certs
eureka:
  instance:
    prefer-ip-address: true # <--- IP 127.0.0.1
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/