server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true # Chuy?n tên service thành ch? th??ng
      routes:
        # --- Route User Service ---
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        # --- Route Post Service ---
        - id: post-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/api/posts/**, /api/feed/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/